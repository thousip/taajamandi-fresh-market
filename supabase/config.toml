# Edge Function settings recorded from production (qebdpjzhbqzjbvjqeztl) on 2026-11-19.
# Sources in supabase/functions/<name>/index.ts are byte-identical to the deployed versions listed in
# supabase/functions/README.md. Only verify_jwt is recorded here; deploying still requires owner approval.

[functions.create-order]
verify_jwt = true

[functions.delivery-update]
verify_jwt = true

[functions.admin-ops]
verify_jwt = true

[functions.packer-ops]
verify_jwt = true

[functions.my-deliveries]
verify_jwt = true

[functions.get-my-role]
verify_jwt = true

[functions.staff-admin]
verify_jwt = true

# Public endpoint: returns customer-safe availability only (no auth required).
[functions.catalogue-availability]
verify_jwt = false

# Overnight build (20 Nov 2026)
[functions.membership-ops]
verify_jwt = true

# Razorpay cannot send a Supabase JWT; authenticity is the HMAC signature over the raw body (see the function).
[functions.razorpay-webhook]
verify_jwt = false

# Launch build (21 Nov 2026): online payment for regular orders (signed-in users only).
[functions.payment-ops]
verify_jwt = true
